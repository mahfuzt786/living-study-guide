name: CD

# Delivery. Every push to main runs the full CI, then publishes a container image to
# GitHub Container Registry. A version tag (v1.2.3) also publishes a GitHub release with
# a ready-to-deploy zip (code + production dependencies) for XAMPP or shared hosting.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Build the deployable zip
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
          mkdir -p dist
          zip -qr "dist/living-study-guide-${GITHUB_REF_NAME}.zip" . \
            -x '.git/*' '.github/*' 'tests/*' 'data/*' 'dist/*' '.env'
          # The deny rule for the data folder belongs in the package.
          zip -q "dist/living-study-guide-${GITHUB_REF_NAME}.zip" data/.htaccess

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
