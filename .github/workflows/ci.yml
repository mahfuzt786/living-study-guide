name: CI

# Pull requests and branch pushes are tested here. Pushes to main and version tags are
# tested by the CD workflow, which runs this file as its first stage before delivering.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP
        run: find public src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit tests
        run: php tests/unit.php

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: End-to-end smoke test
        run: node --test tests/smoke.test.mjs

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Syntax-check the browser modules
        run: |
          mkdir -p "$RUNNER_TEMP/js"
          for f in $(find public/assets/js -name '*.js'); do
            out="$RUNNER_TEMP/js/$(echo "$f" | tr '/' '_').mjs"
            cp "$f" "$out"
            node --check "$out"
          done

      - name: Unit tests
        run: node --test tests/ui.test.mjs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: living-study-guide:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container serves the app
        run: |
          docker run -d --name app -p 8080:8080 living-study-guide:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/login.php && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/login.php | grep -q 'Create your owner account'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api.php?action=state)" = 401

      - name: Container logs
        if: always()
        run: docker logs app || true
